<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery Label Preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 157, 0, 0.24), transparent 26%),
        radial-gradient(circle at 78% 28%, rgba(210, 210, 210, 0.14), transparent 24%),
        #171717;
      color: #f8efe4;
      font-family: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    .page {
      width: min(1180px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    h1 {
      margin: 0 0 22px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .option {
      display: grid;
      gap: 14px;
    }

    .option-title {
      margin: 0;
      color: rgba(248, 239, 228, 0.74);
      font-size: 13px;
      font-weight: 700;
    }

    .card {
      position: relative;
      height: 230px;
      overflow: hidden;
      border-radius: 20px;
      background: #1c1c1b;
      box-shadow: 0 20px 54px rgba(0, 0, 0, 0.32);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(105deg, transparent 0 22%, rgba(255, 255, 255, 0.16) 23%, transparent 31%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 4px);
      opacity: 0.7;
      pointer-events: none;
    }

    .cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .warm .cover {
      object-position: center;
    }

    .mono .cover {
      object-position: center;
    }

    .label {
      position: absolute;
      left: 50%;
      z-index: 2;
      width: min(88%, 350px);
      color: rgba(35, 35, 34, 0.92);
      text-align: center;
      pointer-events: none;
      transform: translateX(-50%);
    }

    .label strong,
    .label span {
      display: block;
    }

    .label strong {
      font-size: 19px;
      line-height: 1.18;
      font-weight: 760;
    }

    .label span {
      margin-top: 5px;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 700;
    }

    .label.banner {
      bottom: 14px;
      width: min(94%, 392px);
      padding: 15px 24px 16px;
      border: 1px solid rgba(255, 255, 255, 0.52);
      border-radius: 22px;
      background:
        linear-gradient(90deg, rgba(255, 248, 229, 0.9), rgba(255, 248, 229, 0.62) 58%, rgba(255, 248, 229, 0.38)),
        rgba(255, 248, 229, 0.58);
      box-shadow: 0 12px 28px rgba(31, 24, 13, 0.18);
      backdrop-filter: blur(14px) saturate(1.12);
    }

    .label.banner::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(115deg, rgba(255, 255, 255, 0.35), transparent 36%, rgba(255, 255, 255, 0.12));
      pointer-events: none;
    }

    .label.toast {
      right: 18px;
      bottom: 18px;
      left: auto;
      width: min(82%, 320px);
      padding: 12px 18px 13px;
      border: 1px solid rgba(255, 255, 255, 0.36);
      border-radius: 17px;
      background: rgba(255, 250, 237, 0.82);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2);
      text-align: left;
      transform: rotate(-1deg);
      backdrop-filter: blur(12px) saturate(1.1);
    }

    .label.toast strong {
      font-size: 17px;
    }

    .label.toast span {
      font-size: 13px;
    }

    .label.paper {
      bottom: 14px;
      width: min(92%, 370px);
      padding: 13px 24px 14px;
      border-radius: 10px 24px 13px 22px;
      background: rgba(248, 235, 206, 0.9);
      box-shadow: 0 11px 24px rgba(57, 41, 20, 0.18);
      transform: translateX(-50%) rotate(-1.4deg);
    }

    .label.paper::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.22), transparent 32%),
        repeating-linear-gradient(0deg, rgba(122, 102, 70, 0.06) 0 1px, transparent 1px 5px);
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        height: 260px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>标签视觉预览</h1>
    <section class="grid">
      <article class="option">
        <p class="option-title">A. 半透明磨砂横幅</p>
        <div class="card warm">
          <img class="cover" src="../assets/kuaishou-proposal-cover-v7.png" alt="">
          <div class="label banner">
            <strong>生活交“享”乐</strong>
            <span>大广赛-广告策划类-国家级和山东省优秀奖</span>
          </div>
        </div>
        <div class="card mono">
          <img class="cover" src="../assets/assassin-proposal-cover-v1.png" alt="">
          <div class="label banner">
            <strong>我不是刺客</strong>
            <span>大广赛-广告策划类-山东省二等奖</span>
          </div>
        </div>
      </article>

      <article class="option">
        <p class="option-title">B. 右下角 toast</p>
        <div class="card warm">
          <img class="cover" src="../assets/kuaishou-proposal-cover-v7.png" alt="">
          <div class="label toast">
            <strong>生活交“享”乐</strong>
            <span>大广赛-广告策划类-国家级和山东省优秀奖</span>
          </div>
        </div>
        <div class="card mono">
          <img class="cover" src="../assets/assassin-proposal-cover-v1.png" alt="">
          <div class="label toast">
            <strong>我不是刺客</strong>
            <span>大广赛-广告策划类-山东省二等奖</span>
          </div>
        </div>
      </article>

      <article class="option">
        <p class="option-title">C. 薄纸片标签</p>
        <div class="card warm">
          <img class="cover" src="../assets/kuaishou-proposal-cover-v7.png" alt="">
          <div class="label paper">
            <strong>生活交“享”乐</strong>
            <span>大广赛-广告策划类-国家级和山东省优秀奖</span>
          </div>
        </div>
        <div class="card mono">
          <img class="cover" src="../assets/assassin-proposal-cover-v1.png" alt="">
          <div class="label paper">
            <strong>我不是刺客</strong>
            <span>大广赛-广告策划类-山东省二等奖</span>
          </div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
